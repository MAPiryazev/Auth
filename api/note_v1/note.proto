syntax = "proto3";

package note_v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

option go_package =  "github.com/MAPiryazev/Auth/pkg/note_v1;note_v1";

service NoteV1 {
    rpc Create(CreateRequest) returns (CreateResponce);
    rpc Get(GetRequest) returns (GetResponce);
    rpc Update(UpdateRequest) returns (google.protobuf.Empty);
    rpc Delete(DeleteRequest) returns (google.protobuf.Empty);
}

message NoteINfo{ // наполнение записи
    string name = 1;
    string email = 2;
    string password = 3;
    string password_coonfirm = 4;
    enum Role{
        role_unspecified = 0;
        user = 1;
        admin = 2;
    }
}

message Note{ //id записи, тело, и справочная информация о ней
    int64 id = 1;
    NoteINfo info =2;
    google.protobuf.Timestamp created_at = 3;
    google.protobuf.Timestamp updated_at =4;
}

message CreateRequest {
    NoteINfo info = 1;
}

message CreateResponce{
    int64 id = 1;
}

message GetRequest {
    int64 id = 1;
}

message GetResponce {
    int64 id = 1;
    string name = 2;
    string email = 3;
    NoteINfo.Role role = 4;
    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp updated_at =6;
}

message UpdateNoteInfo {
    google.protobuf.StringValue name = 1;
    google.protobuf.StringValue email = 2;
}

message UpdateRequest {
    int64 id = 1;
    UpdateNoteInfo info = 2;
}

message DeleteRequest{
    int64 id = 1;
}